<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poker Table</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --bg: #07140f;
            --bg-2: #102a1b;
            --table: #0d3b2b;
            --table-2: #1b5a3d;
            --gold: #f7c66b;
            --gold-2: #d99d2d;
            --panel: rgba(12, 25, 19, 0.78);
            --panel-border: rgba(240, 201, 108, 0.4);
            --text: #edf9ef;
            --muted: #b8d5bf;
            --success: #6fe38b;
            --danger: #ff7d7d;
            --card-bg: #f7f7f7;
            --card-text: #111827;
            --shadow: rgba(0, 0, 0, 0.28);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 100%);
            color: var(--text);
        }

        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 18px 48px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-weight: 700;
            color: #20170b;
            background: linear-gradient(135deg, var(--gold), var(--gold-2));
            box-shadow: 0 8px 18px rgba(247, 198, 107, 0.35);
        }

        h1 {
            margin: 0;
            font-size: clamp(1.8rem, 3vw, 3rem);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .status-pill {
            background: rgba(111, 227, 139, 0.12);
            color: var(--success);
            padding: 10px 14px;
            border-radius: 999px;
            border: 1px solid rgba(111, 227, 139, 0.35);
            font-size: 0.92rem;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(250px, 320px) minmax(0, 1fr);
            gap: 22px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            box-shadow: 0 18px 36px var(--shadow);
            backdrop-filter: blur(8px);
        }

        .sidebar {
            padding: 18px;
        }

        .join-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        input {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.14);
            color: var(--text);
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
        }

        input::placeholder { color: var(--muted); }

        button {
            border: none;
            border-radius: 10px;
            padding: 12px 16px;
            font-weight: 700;
            transition: transform 0.15s ease, opacity 0.15s ease, filter 0.15s ease;
            cursor: pointer;
            color: #0e1d17;
            background: linear-gradient(135deg, var(--gold), var(--gold-2));
            box-shadow: 0 10px 20px rgba(247, 198, 107, 0.18);
        }

        button:hover:not(:disabled) {
            transform: translateY(-1px);
            filter: brightness(1.05);
        }

        button.secondary {
            background: linear-gradient(135deg, #355f68, #1e4150);
            color: white;
            box-shadow: none;
        }

        button.action-btn {
            flex: 1;
            min-width: 90px;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(255,255,255,0.025);
            border: 1px solid rgba(255,255,255,0.08);
            margin-top: 14px;
        }

        .meta-row strong {
            color: var(--muted);
            font-size: 0.88rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .meta-row span {
            font-size: 1.15rem;
            font-weight: 700;
        }

        .table-panel {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .table-surface {
            position: relative;
            background: linear-gradient(135deg, var(--table), var(--table-2));
            border-radius: 24px;
            padding: 26px 18px 18px;
            min-height: 420px;
            border: 2px solid rgba(247, 198, 107, 0.24);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.22);
            overflow: hidden;
        }

        .table-surface::before {
            content: "";
            position: absolute;
            inset: 16px;
            border-radius: 18px;
            border: 2px solid rgba(255,255,255,0.08);
            pointer-events: none;
        }

        .table-seats {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        .seat {
            position: absolute;
            width: 164px;
            padding: 10px 8px 8px;
            border-radius: 14px;
            background: rgba(8, 15, 13, 0.34);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 10px 18px rgba(0,0,0,0.18);
            text-align: center;
            color: var(--text);
        }

        .seat.active {
            border-color: rgba(247, 198, 107, 0.75);
            box-shadow: 0 0 0 1px rgba(247, 198, 107, 0.5);
        }

        .seat-name {
            font-size: 0.78rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 6px;
        }

        .seat-cards {
            display: flex;
            justify-content: center;
            gap: 6px;
            min-height: 50px;
        }

        .seat-meta {
            font-size: 0.68rem;
            color: var(--muted);
            margin-top: 6px;
            line-height: 1.35;
        }

        .card.back {
            background: linear-gradient(135deg, #0f5b8f, #133d5a);
            color: #f1f5f9;
            border: 2px solid rgba(255,255,255,0.28);
            box-shadow: inset 0 0 12px rgba(255,255,255,0.18);
        }

        .table-top {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            min-height: 250px;
            justify-content: center;
            padding-top: 66px;
        }

        .pot-box {
            background: rgba(10, 16, 13, 0.28);
            border: 1px solid rgba(247, 198, 107, 0.32);
            border-radius: 999px;
            padding: 10px 22px;
            text-align: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.22);
        }

        .pot-box small {
            display: block;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.72rem;
        }

        .pot-box strong {
            font-size: clamp(1.5rem, 3vw, 2.4rem);
        }

        .community {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            min-height: 64px;
        }

        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            min-height: 42px;
        }

        .card {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 74px;
            border-radius: 12px;
            background: var(--card-bg);
            color: var(--card-text);
            font-weight: 800;
            font-size: 1.1rem;
            box-shadow: 0 8px 18px rgba(0,0,0,0.25);
            border: 2px solid rgba(17, 24, 39, 0.12);
        }

        .card.red { color: #c92c2c; }

        .player-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .player {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 12px;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        .player.active {
            border-color: rgba(247, 198, 107, 0.8);
            box-shadow: 0 0 0 1px rgba(247, 198, 107, 0.5);
            transform: translateY(-1px);
        }

        .player.you {
            background: rgba(111, 227, 139, 0.08);
        }

        .player-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 0.9rem;
            background: linear-gradient(135deg, var(--gold), var(--gold-2));
            color: #1f1a0d;
            font-weight: 800;
        }

        .player-name {
            font-weight: 700;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-meta {
            color: var(--muted);
            font-size: 0.8rem;
            line-height: 1.6;
        }

        .player-hand {
            margin-top: 10px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .controls {
            display: none;
            margin-top: 10px;
            padding: 16px;
            border-radius: 14px;
            background: rgba(255,255,255,0.025);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .controls h3 {
            margin: 0 0 12px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .action-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .amount-box {
            min-width: 120px;
            flex: 1;
        }

        .message-block {
            padding: 14px 16px;
            border-radius: 12px;
            background: rgba(247, 198, 107, 0.08);
            border: 1px solid rgba(247, 198, 107, 0.2);
            color: var(--text);
            min-height: 54px;
            display: flex;
            align-items: center;
        }

        .hand-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 2px;
        }

        .section-title {
            margin: 0;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
        }

        @media (max-width: 860px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="topbar">
            <div class="brand">
                <div class="brand-mark">♠</div>
                <h1>Poker</h1>
            </div>
            <div id="status" class="status-pill">Not connected</div>
        </div>

        <div class="layout">
            <aside class="panel sidebar">
                <div class="join-box">
                    <input id="name" placeholder="Your nickname" value="Player" maxlength="12" />
                    <div class="input-group">
                        <button id="joinBtn">Join table</button>
                        <button id="startBtn" class="secondary">Start game</button>
                    </div>
                </div>

                <div class="meta-row">
                    <strong>Pot</strong>
                    <span id="pot">0</span>
                </div>
                <div class="meta-row">
                    <strong>Stage</strong>
                    <span id="stage">Waiting</span>
                </div>
                <div class="meta-row">
                    <strong>Current bet</strong>
                    <span id="currentBet">0</span>
                </div>
                <div class="meta-row">
                    <strong>Players</strong>
                    <span id="playerCount">0</span>
                </div>
            </aside>

            <main class="panel table-panel">
                <div class="table-surface">
                    <div id="tableSeats" class="table-seats"></div>
                    <div class="table-top">
                        <div class="pot-box">
                            <small>Pot</small>
                            <strong id="potLarge">0</strong>
                        </div>
                        <div class="community" id="community"></div>
                    </div>
                </div>

                <div class="controls" id="controls">
                    <h3>Actions</h3>
                    <div class="action-row">
                        <button class="action-btn" data-action="check">Check</button>
                        <button class="action-btn" data-action="call">Call</button>
                        <button class="action-btn" data-action="fold">Fold</button>
                        <button class="action-btn" data-action="bet">Bet</button>
                        <button class="action-btn" data-action="raise">Raise</button>
                        <input class="amount-box" id="amount" type="number" min="1" value="20" placeholder="Amount" />
                    </div>
                </div>

                <div class="message-block" id="message">Waiting for players...</div>

                <div class="hand-section">
                    <h3 class="section-title">Your hand</h3>
                    <div id="hand" class="cards"></div>
                </div>

                <div class="hand-section">
                    <h3 class="section-title">Players</h3>
                    <div id="players" class="player-list"></div>
                </div>
            </main>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
